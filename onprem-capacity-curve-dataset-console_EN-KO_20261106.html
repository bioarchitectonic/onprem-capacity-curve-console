<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On-Prem Capacity Curve · Dataset Console v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a recorder-analysis bay. Header strip, machine channels, three panels (curve · frame lens · event log),
   a full-width cell stack on the pass clock, the Pro supply A/B, a sticky transport. Near-black bench, hairline panels, one orange accent, one blue. */
:root{
  --bg:#08090B; --panel:#0E1013; --panel-2:#14171C;
  --ink:#E8EAEE; --ink2:rgba(232,234,238,.74); --ink3:rgba(232,234,238,.54); --ink4:rgba(232,234,238,.36);
  --dim:#606672; --rule:rgba(96,102,114,.42); --rule2:rgba(96,102,114,.22);
  --accent:#FF7A3D; --accent-wash:rgba(255,122,61,.09); --pond:#6FC3FF; --pond-wash:rgba(111,195,255,.10);
  --warm:#F2E68A; --alarm:#FF4A3A;
  --mark-sel:#EB6828; --mark-ref:#499DD7; --mark-ctx:#606672;
  --sans:"Work Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"DM Mono","IBM Plex Sans KR","Apple SD Gothic Neo",ui-monospace,"SF Mono",Menlo,monospace;
  --lh:26px; --labw:262px; --valw:520px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:14px 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.console{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);max-width:1720px;margin:0 auto}
.console > *{background:var(--panel);min-width:0}
.k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.acc{color:var(--accent)}

/* header strip */
.hbar{display:grid;grid-template-columns:minmax(250px,1.5fr) minmax(210px,1.15fr) minmax(190px,1fr) minmax(190px,1fr) auto;gap:1px;background:var(--rule)!important}
.hbar > div{background:var(--bg);padding:10px 14px 9px;min-width:0}
.hk{font-size:14px;letter-spacing:.13em;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{font-size:11px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-lang{display:flex;align-items:center;justify-content:flex-end}
.hsx{font-size:11px;letter-spacing:.08em;color:var(--ink2);text-transform:uppercase;margin-left:6px}

/* chips + segmented controls */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:1px 6px;
  border:1px solid var(--rule);color:var(--ink2);white-space:nowrap;line-height:1.5;font-family:var(--mono)}
.chip.rec{border-color:var(--pond);color:var(--pond)}
.chip.warm{border-color:var(--warm);color:var(--warm)}
.chip.alarm{border-color:var(--alarm);color:var(--alarm)}
.chip.hot{border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--rule)}
.seg button{padding:4px 10px;font-size:11px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.seg button + button{border-left:1px solid var(--rule)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#08090B}
.seg.sm button{padding:3px 8px;font-size:10.5px}
.seg.xs button{padding:2px 7px;font-size:10px}

/* machine channels */
.chan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule)!important}
.ch{background:var(--panel);padding:9px 12px 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:3px;
  border-top:2px solid transparent;cursor:pointer;min-width:0}
.ch:hover{background:var(--panel-2)}
.ch.on{background:var(--panel-2);border-top-color:var(--accent)}
.chb{display:flex;gap:8px;align-items:baseline;min-width:0}
.cnum{font-size:10px;letter-spacing:.12em;color:var(--ink4)}
.cn{font-size:13px;letter-spacing:.13em;color:var(--ink);white-space:nowrap}
.ch.on .cn{color:var(--accent)}
.cstat{justify-self:end}
.cspec,.cmeta{grid-column:1/-1;font-size:10.5px;color:var(--ink3)}
.cmeta{color:var(--ink2);white-space:normal}
.cfoot{grid-column:1/-1;display:flex;gap:10px;align-items:end;justify-content:space-between;margin-top:3px}
.cspark{width:min(100%,190px);height:24px;display:block}
.cspark rect{fill:var(--dim)}
.cspark rect.nil{fill:var(--rule)}
.ch.on .cspark rect{fill:var(--mark-sel)}
.ch.on .cspark rect.nil{fill:var(--rule)}

/* panels */
.top{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr) minmax(0,.86fr);gap:1px;background:var(--rule)!important}
.top > section{background:var(--panel);min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule2);min-height:38px;min-width:0}
.lt{display:inline-grid;place-items:center;width:19px;height:19px;flex:none;border:1px solid var(--accent);color:var(--accent);font-size:11px;line-height:1}
.ph h2{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.sub{font-size:10.5px;letter-spacing:.09em;color:var(--ink3);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.idt{text-transform:none;color:var(--ink2);letter-spacing:.04em}
.ph .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.chart{position:relative;min-width:0}
.chart svg{display:block}
svg text{font-family:var(--mono);fill:var(--ink3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 12px 0;font-size:10.5px;color:var(--ink3);letter-spacing:.04em}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend svg{width:22px;height:12px}

/* curve */
.gl{stroke:var(--rule2);stroke-width:1}
.tk{font-size:10.5px}
.axt{font-size:10.5px;fill:var(--ink2);letter-spacing:.06em}
.iso{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4;fill:none}
.isol{font-size:10px;fill:var(--ink3);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.pt.sel{fill:var(--mark-sel);stroke:var(--panel);stroke-width:1.6}
.pt.sel.ring{fill:var(--panel);stroke:var(--mark-sel);stroke-width:2}
.pt.ctx{fill:var(--mark-ctx);stroke:var(--panel);stroke-width:1.2}
.pt.ctx.ring{fill:var(--panel);stroke:var(--mark-ctx);stroke-width:1.6}
.pt.lab{fill:var(--panel);stroke:var(--ink4);stroke-width:1.2}
.lad{fill:none;stroke:var(--mark-sel);stroke-width:1.25;opacity:.6}
.lad.ud{stroke-dasharray:4 3}
.hz{fill:transparent;stroke:none;cursor:pointer}
.clab{font-size:10.5px;letter-spacing:.1em;fill:var(--ink3);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.clab.sel{fill:var(--ink)}
.aring{fill:none;stroke:var(--pond);stroke-width:2}
.aring-l{font-size:10.5px;fill:var(--ink)}
.aring-bg{fill:var(--bg);opacity:.85}

/* accuracy axis: stage 1 (legacy suites) and stage 2 (axis 2 task families) */
.accp{border-top:1px solid var(--rule2);padding-top:8px;margin-top:auto}
.acch{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:0 12px;font-size:10.5px;color:var(--ink3)}
.acch .k{color:var(--ink2);white-space:normal!important;min-width:0}
.acch span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.acch svg{width:22px;height:12px}
.acch .seg{margin-left:auto}
.accf{font-size:11px;letter-spacing:.12em;fill:var(--ink2)}
.al{fill:none;stroke-width:1.5}
.al.mq,.al.f1{stroke:var(--mark-ref)}
.al.ar,.al.f2{stroke:var(--ink2)}
.al.ud{stroke-dasharray:4 3}
.ad.mq,.ad.f1{fill:var(--mark-ref)}
.ad.ar,.ad.f2{fill:var(--ink2)}
.f34{stroke:var(--ink3);stroke-width:1.5;stroke-dasharray:1 3;fill:none}
.macd{fill:var(--panel);stroke:var(--ink);stroke-width:1.3}
.thr{stroke:var(--warm);stroke-width:1;stroke-dasharray:2 3;opacity:.75}
.thrl{font-size:10px;fill:var(--warm);paint-order:stroke;stroke:var(--panel);stroke-width:3px}

/* lens */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule2);border-bottom:1px solid var(--rule2)}
.kpi{background:var(--panel);padding:8px 10px 9px;min-width:0}
.kpi .v{font-family:var(--sans);font-size:23px;font-weight:500;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .u{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;font-family:var(--mono);line-height:1.35}
.kpi .k{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{display:block;margin-top:4px}
.gauge .band{fill:var(--rule2)}
.gauge .mid{stroke:var(--ink4);stroke-width:1}
.gauge .val{fill:var(--pond)}
.gauge .val.warn{fill:var(--warm)}
.gauge .val.out{fill:var(--alarm)}
.phb-warm{fill:rgba(232,234,238,.03)}
.phb-steady{fill:var(--pond-wash)}
.c0l{stroke:var(--ink4);stroke-width:1}
.phl{font-size:10px;letter-spacing:.08em;fill:var(--ink3)}
.ltr{fill:none;stroke:var(--pond);stroke-width:1.5;stroke-linejoin:round}
.r1m{stroke:var(--mark-sel);stroke-width:2;stroke-dasharray:6 4}
.r2m{stroke:var(--mark-ref);stroke-width:1.5}
.refl{stroke:var(--warm);stroke-width:1.2;stroke-dasharray:2 3;opacity:.9}
.idl{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}
.rl{font-size:10.5px;fill:var(--ink)}
.lph{stroke:var(--accent);stroke-width:1.5}
.xh{stroke:var(--ink4);stroke-width:1}
.notes{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 12px 12px;font-size:11px;color:var(--ink2);border-top:1px solid var(--rule2)}
.notes dt{color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;font-size:10.5px;white-space:nowrap;padding-top:1px}
.notes dd{margin:0;min-width:0;overflow-wrap:anywhere}
.notes .src{color:var(--ink4)}
@media (min-width:821px){#pB{position:relative}#pB .notes{position:absolute;left:0;right:0;bottom:0;overflow:auto;align-content:start;
  background:linear-gradient(var(--panel) 30%,rgba(14,16,19,0)) top/100% 26px no-repeat local,linear-gradient(rgba(14,16,19,0),var(--panel) 70%) bottom/100% 26px no-repeat local,
  radial-gradient(farthest-side at 50% 0,rgba(232,234,238,.10),transparent) top/100% 9px no-repeat scroll,radial-gradient(farthest-side at 50% 100%,rgba(232,234,238,.14),transparent) bottom/100% 11px no-repeat scroll;
  background-color:var(--panel)}}

/* event log */
.evl{list-style:none;margin:0;padding:4px 0;overflow:auto}
@media (min-width:1241px){#pC{position:relative}#pC .evl{position:absolute;top:39px;bottom:64px;left:0;right:0}#pC .evstrip{position:absolute;left:0;right:0;bottom:0}}
.ev{display:grid;grid-template-columns:34px 100px minmax(0,1fr);gap:2px 8px;padding:6px 12px;border-left:2px solid transparent;align-items:baseline}
.ev.run{cursor:pointer}
.ev.run:hover{background:var(--panel-2)}
.ev.on{border-left-color:var(--accent);background:var(--accent-wash)}
.ev .eid{color:var(--ink4);font-size:10.5px}
.ev .ets{color:var(--ink2);font-size:11px;white-space:nowrap}
.ev .etx{color:var(--ink);font-size:11.5px;grid-column:3;min-width:0}
.ev .ech{grid-column:3;justify-self:start}
.evstrip{border-top:1px solid var(--rule2);padding:6px 12px 8px}
.evstrip svg{display:block}
.evb{fill:var(--dim)}
.evb.on{fill:var(--accent)}
.evt{stroke:var(--ink4);stroke-width:1}
.evt.rl{stroke:var(--warm)}

/* cell stack */
#pD{background:var(--panel)}
.stack-wrap{overflow-x:auto}
.stack{position:relative;min-width:1180px;outline:none}
.srow{display:grid;grid-template-columns:20px calc(var(--labw) - 20px) minmax(0,1fr) var(--valw);border-bottom:1px solid var(--rule2);position:relative}
.srow.lane{height:var(--lh)}
.srow.sruler{height:30px;background:var(--bg)}
.srow.swall{height:52px}
.sg{position:relative}
.glab{position:absolute;left:4px;top:3px;width:13px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.14em;
  color:var(--pond);border-left:1px solid rgba(111,195,255,.5);text-align:center;white-space:nowrap;overflow:hidden;z-index:1}
.slab{display:flex;align-items:center;gap:9px;padding:0 10px 0 4px;font-size:11.5px;white-space:nowrap;overflow:hidden;min-width:0}
.slab .ln{color:var(--ink4);font-size:10.5px;width:16px}
.slab .tag{color:var(--ink)}
.slab .qt{color:var(--ink3);font-size:10.5px;margin-left:auto}
button.slab:hover .tag{color:var(--accent)}
.stl{position:relative;min-width:0;cursor:crosshair;touch-action:none}
.stl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sval{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 94px;align-items:center;border-left:1px solid var(--rule2);font-size:11.5px;font-variant-numeric:tabular-nums}
.sval > span{padding:0 7px;text-align:right;white-space:nowrap;overflow:hidden;color:var(--ink2);position:relative}
.sval > span:last-child{text-align:left}
.shead > span{color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.srow.on{background:var(--accent-wash)}
.srow.on .tag{color:var(--accent)}
.srow.on .sval > span{color:var(--ink)}
.win{fill:rgba(232,234,238,.035);stroke:var(--rule);stroke-width:1}
.win.sup{fill:url(#hatch)}
.win.bad{stroke:var(--alarm)}
.stdy{fill:rgba(232,234,238,.05)}
.srow.on .stdy{fill:var(--accent-wash)}
.trc{fill:none;stroke:var(--ink2);stroke-width:1.1;stroke-linejoin:round}
.trc.sup{stroke:var(--ink4)}
.trc.bad{stroke:var(--alarm)}
.srow.on .trc{stroke:var(--pond);stroke-width:1.4}
.nolab{font-size:10px;letter-spacing:.1em;fill:var(--ink4)}
.wtr{fill:none;stroke:var(--ink3);stroke-width:1}
.wwin{fill:rgba(232,234,238,.04)}
.wwin.on{fill:rgba(255,122,61,.18)}
.rt{font-size:10.5px;fill:var(--ink3)}
.rtk{stroke:var(--rule);stroke-width:1}
.rtk.m{stroke:var(--rule2)}
.wnow{color:var(--ink)!important;text-align:left!important;grid-column:1/-1;font-size:12px}
.playhead{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);pointer-events:none;z-index:2}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:5px solid transparent;border-top-color:var(--accent)}
.phtag{position:absolute;top:13px;left:6px;font-size:10.5px;color:#08090B;background:var(--accent);padding:0 4px;white-space:nowrap;line-height:1.5}

/* supply A/B */
#pE{background:var(--panel)}
.abgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1px;background:var(--rule2)}
.abgrid > div{background:var(--panel);min-width:0}
.abside{display:flex;flex-direction:column}
.abside .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.abA{fill:rgba(73,157,215,.12)}
.abG{fill:rgba(235,104,40,.12)}
.abV{fill:url(#hatch)}
.abI{fill:rgba(232,234,238,.035)}
.absw{fill:rgba(232,234,238,.11)}
.abl{font-size:10.5px;letter-spacing:.08em;fill:var(--ink2)}
.abl.v{fill:var(--alarm)}
.abt{font-size:10px;fill:var(--ink3)}
.abhd{font-size:10px;letter-spacing:.1em;fill:var(--ink3)}
.abtr{fill:none;stroke:var(--ink2);stroke-width:1;stroke-linejoin:round}
.abm{stroke-width:2}
.abm.A{stroke:var(--mark-ref)}
.abm.G{stroke:var(--mark-sel)}
.abm.V{stroke:var(--ink3);stroke-dasharray:4 3}
.abm.thin{stroke-width:1.5}
.abml{font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
.abpct{font-family:var(--sans);font-size:15px;font-weight:500;fill:var(--accent)}
.abd.A{fill:var(--mark-ref)}
.abd.G{fill:var(--mark-sel)}
.abd.V{fill:var(--ink3)}
.abd.O{fill:var(--ink4)}
.abband{fill:rgba(232,234,238,.06)}
.abmed{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}
.abwit{fill:none;stroke:var(--ink2);stroke-width:1.1;stroke-linejoin:round}
.abthr{stroke:var(--warm);stroke-width:1;stroke-dasharray:2 3}
.lgA{fill:rgba(73,157,215,.55)}
.lgG{fill:rgba(235,104,40,.55)}
.lgS{fill:rgba(232,234,238,.32)}
.lgI{fill:rgba(232,234,238,.10);stroke:var(--rule)}
.arm{display:inline-block;width:8px;height:8px;margin-right:7px;vertical-align:0}
.arm.A{background:var(--mark-ref)}
.arm.G{background:var(--mark-sel)}
.arm.N{background:var(--dim)}
.tcap{padding:10px 12px 5px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:400;color:var(--ink3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:6px 9px;
  border-bottom:1px solid var(--rule2);white-space:normal;vertical-align:bottom;line-height:1.35}
.tbl td{padding:5px 9px;border-bottom:1px solid var(--rule2);text-align:right;color:var(--ink2);white-space:nowrap;vertical-align:top}
.tbl th:first-child,.tbl td:first-child,.tbl .l{text-align:left}
.tbl td:first-child{color:var(--ink)}
.tbl tr.pri td{color:var(--ink);border-top:1px solid var(--rule)}
.tbl tr.rec td:first-child{color:var(--pond)}
.tbl .tn{color:var(--ink3)}
.tbl td.v{white-space:normal;min-width:170px;line-height:1.4}
.tbl td.v .chip{margin-right:6px}
.tbl.t7b th,.tbl.t7b td{padding:5px 7px}
.tbl.t7b th.rec{color:var(--pond)}
.tbl.t7b td:first-child{color:var(--ink3);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:normal;min-width:110px}
.tnote{padding:8px 12px 12px;font-size:11px;color:var(--ink3);line-height:1.5}

/* transport */
.transport{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:1px;
  background:var(--rule)!important;border-top:1px solid var(--rule)}
.transport > *{background:var(--bg);height:100%;display:flex;align-items:center;padding:8px 14px;min-width:0}
.tclock{font-family:var(--sans);font-size:30px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.02em;border:1px solid var(--accent);margin:7px 0 7px 10px;padding:2px 12px!important;height:auto!important;line-height:1.15}
.tclock small{font-size:17px;color:rgba(255,122,61,.75)}
.tinfo{flex-direction:column;align-items:flex-start!important;justify-content:center;gap:2px}
.tinfo .a{font-size:10.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.tinfo .b{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tbtns{gap:4px}
.tb{width:38px;height:32px;display:grid;place-items:center;border:1px solid var(--rule);color:var(--ink2)}
.tb:hover{color:var(--ink);border-color:var(--ink4)}
.tb.play{background:var(--accent);border-color:var(--accent);color:#08090B;width:46px}
.tb svg{width:14px;height:14px;fill:currentColor}

// ---------- playhead + transport
function updatePlayhead(force) {
  const run = RUNS[S.run];
  if (!SS) return;
  const x = SS.X(S.t);
  const ph = $('#ph'); ph.style.left = (SS.left + x) + 'px';
  $('#phtag').textContent = clock(S.t).slice(0, 5);
  const c = cellAt(run, S.t), tag = c ? c.tag : null;
  if (tag !== onTag || force) {
    onTag = tag;
    $$('#stack .lane').forEach(r => r.classList.toggle('on', r.dataset.tag === tag));
    $$('#wlane .wwin').forEach(r => r.classList.toggle('on', !!c && +r.dataset.c0 === c.c0));
    renderRing(); renderAccuracy();
  }
  renderLens(force);
  const w = wAt(run, S.t);
  $('#wnow').textContent = `${clock(S.t)} · ${w == null ? '—' : nf(w, 1) + ' W'}`;
  const hm = clock(S.t);
  $('#tc-hm').textContent = hm.slice(0, 5); $('#tc-s').textContent = hm.slice(5);
  $('#tc-a').textContent = `EDT · 2026-${mmdd(S.t)} · ${MACH[run.m].short} ${L(RUNMETA[run.id].short)}`;
  $('#tc-b').textContent = c
    ? `${t('T_cell')} ${String(laneNo(run, c.tag)).padStart(2, '0')} ${t('T_of')} ${laneTags(run).length} · ${c.tag} · ${t('ph_' + phase(c, S.t))}`
    : t('T_between');
  const st = $('#stack'), [T0, T1] = dom(run);
  st.setAttribute('aria-valuenow', String(Math.round(((S.t - T0) / (T1 - T0)) * 100)));
  st.setAttribute('aria-valuetext', `${hm} EDT${c ? ' · ' + c.tag : ''}`);
}
function setT(v) { const [T0, T1] = dom(RUNS[S.run]); S.t = Math.max(T0, Math.min(T1, v)); updatePlayhead(); }
function cellStops(run) { return windows(run).map(c => c.s0 + 60); }
function stepCell(dir) {
  const stops = cellStops(RUNS[S.run]);
  if (dir > 0) { const n = stops.find(s => s > S.t + 1); if (n != null) setT(n); }
  else { const p = [...stops].reverse().find(s => s < S.t - 1); if (p != null) setT(p); }
}
function goEnd(last) { const st = cellStops(RUNS[S.run]); setT(last ? st[st.length - 1] : st[0]); }
let raf = 0, lastTs = 0;
function play(on) {
  S.playing = on;
  const b = $('#t-play'); b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', t(on ? 'T_pause' : 'T_play'));
  $('#t-play-i').innerHTML = on ? '<rect x="2.5" y="1.5" width="3.2" height="11"/><rect x="8.3" y="1.5" width="3.2" height="11"/>' : '<path d="M3 1.5v11L12.5 7z"/>';
  cancelAnimationFrame(raf);
  if (on) { lastTs = performance.now(); raf = requestAnimationFrame(tick); }
}
function tick(ts) {
  const dt = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  const [T0, T1] = dom(RUNS[S.run]);
  S.t += dt * S.speed;
  if (S.t >= T1) { if (S.loop) S.t = T0; else { S.t = T1; updatePlayhead(); play(false); return; } }
  updatePlayhead();
  if (S.playing) raf = requestAnimationFrame(tick);
}

// ---------- selection + language

}

document.addEventListener('keydown', e => {

stackEl.addEventListener('pointerdown', ev => {
  if (!ev.target.closest('.stl') || !SS) return;
  drag = true; stackEl.setPointerCapture(ev.pointerId); if (S.playing) play(false); scrubTo(ev);
});
stackEl.addEventListener('pointermove', ev => { if (drag) scrubTo(ev); });
stackEl.addEventListener('pointerup', ev => { drag = false; try { stackEl.releasePointerCapture(ev.pointerId); } catch (er) { /* ignore */ } });
// curve tooltips
$('#curve').addEventListener('pointermove', ev => {
  const g = ev.target.closest('g[data-run]'); if (!g) { hideTip(); return; }
  const run = RUNS[g.dataset.run], c = recRow(run, g.dataset.tag), lm = LANE[c.tag];
  const en = c.v5 ? `Δv5 − Δref ${sgn(c.v5.dref)} W` : `${nf(c.g, 0)} Wh/1M ${S.lang === 'ko' ? '총량' : 'gross'}${c.ref != null ? ` · ${nf(c.ref, 0)} ${S.lang === 'ko' ? '순량' : 'net'}` : ''}`;
  showTip(`<b>${MACH[run.m].name} · ${esc(L(RUNMETA[run.id].short))}</b>${c.tag} · ${lm.quant} · ${nf(lm.bpw, 2)} bpw<br>${nf(c.d)} tok/s · ${nf(c.wh)} W<br>${esc(en)} · ${nf(c.wh / c.d, 1)} J/tok`, ev);
});
$('#curve').addEventListener('pointerleave', hideTip);
$('#acc').addEventListener('pointermove', ev => { const h = ev.target.closest('[data-tip]'); if (h) showTip(h.dataset.tip, ev); else hideTip(); });
$('#acc').addEventListener('pointerleave', hideTip);
// lens crosshair
$('#lens').addEventListener('pointermove', ev => {
  if (!LS) return;
  const r = $('#lens svg').getBoundingClientRect(), x = ev.clientX - r.left;
  const xh = $('#lens-xh');
  if (x < LS.m.l || x > LS.W - LS.m.r) { hideTip(); xh.setAttribute('visibility', 'hidden'); return; }
  const tt = LS.a + ((x - LS.m.l) / (LS.W - LS.m.l - LS.m.r)) * (LS.b - LS.a), w = wAt(LS.run, tt);
  const ph = tt < LS.c.c0 ? '' : tt < LS.c.s0 ? t('lens_warm') : tt <= LS.c.s1 ? t('lens_steady') : '';
  xh.setAttribute('x1', f1(x)); xh.setAttribute('x2', f1(x)); xh.setAttribute('visibility', 'visible');
  showTip(`<b>${clock(tt)} EDT</b>${w == null ? '—' : nf(w, 1) + ' W'} · R2${ph ? ' · ' + esc(ph) : ''}`, ev);
});
$('#lens').addEventListener('pointerleave', () => { hideTip(); const xh = $('#lens-xh'); if (xh) xh.setAttribute('visibility', 'hidden'); });
// A/B crosshair
$('#abchart').addEventListener('pointermove', ev => {
  if (!ABS) return;
  const svg = $('#abchart svg'), r = svg.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top, xh = $('#ab-xh');
  if (x < ABS.m.l || x > ABS.W - ABS.m.r || y < ABS.y1 - 30 || y > ABS.yB) { hideTip(); xh.setAttribute('visibility', 'hidden'); return; }
  const A = D.ab, tt = ABS.T0 + ((x - ABS.m.l) / (ABS.W - ABS.m.l - ABS.m.r)) * (ABS.T1 - ABS.T0);
  xh.setAttribute('x1', f1(x)); xh.setAttribute('x2', f1(x)); xh.setAttribute('visibility', 'visible');
  const h = nearest(abHarness(), tt), hv = h && h[1] != null && Math.abs(h[0] - tt) <= 3 ? nf(h[1], 1) + ' W' : '—';
  const rw = wAt({ trace: A.rec }, tt), rv = rw == null ? '—' : nf(rw, 1) + ' W';
  const cl = nearest(A.calls, tt - A.t0), dv = cl && Math.abs(cl[0] - (tt - A.t0)) <= 25 ? nf(cl[1]) + ' tok/s' : '—';
  const wt = nearest(A.wit, tt), wv = wt && Math.abs(wt[0] - tt) <= 10 ? nf(Math.abs(wt[1]), 2) + ' W' : '—';
  const rel = Math.round(tt - A.t0);
  showTip(`<b>${clock(tt)} EDT · t0 ${rel >= 0 ? '+' : '−'}${Math.abs(rel)} s</b>${esc(abPhase(tt))}<br>${esc(t('E_tip_h'))} ${hv} · ${esc(t('E_tip_r'))} ${rv}<br>${esc(t('E_tip_d'))} ${dv} · ${esc(t('E_tip_w'))} ${wv}`, ev);
});
$('#abchart').addEventListener('pointerleave', () => { hideTip(); const xh = $('#ab-xh'); if (xh) xh.setAttribute('visibility', 'hidden'); });

// re-render on width changes only (height changes come from our own content), once per frame
let rz = 0, lastW = 0;
new ResizeObserver(entries => {
  const w = Math.round(entries[0].contentRect.width); if (w === lastW) return; lastW = w;
  cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { renderCurve(); renderAccuracy(); renderStrip(); drawStack(); renderAB(); lensKey = ''; renderLens(true); });
}).observe($('#app'));

// boot: open on the first cell of the selected run, steady window
{ const c = windows(RUNS[S.run])[0]; S.t = c ? c.s0 + 60 : dom(RUNS[S.run])[0]; }
renderAll();
})();
</script>
</body>
</html>
